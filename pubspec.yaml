name: tawwab
description: "Tawwab (تَوَّاب) — an Islamic app: prayer times, Quran, adhkar, global tasbeeh ranking, and a repentance (Dhambi) companion."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.0.0

  # Branding / fonts
  google_fonts: ^6.0.0

  # Islamic features
  adhan: ^2.0.0           # prayer-time calculations
  hijri: ^3.0.0           # Hijri calendar

  # Local persistence
  shared_preferences: ^2.0.0

  # HTTP (for Quran API / future backend)
  http: ^1.2.0

  # Location for prayer times
  geolocator: ^13.0.0

  # Notifications (adhan reminders)
  flutter_local_notifications: ^18.0.0

  # Haptic feedback on tasbeeh
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_source.png"
  min_sdk_android: 23
  adaptive_icon_background: "#14524D"
  adaptive_icon_foreground: "assets/icon_source.png"
  remove_alpha_ios: true
