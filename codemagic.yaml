# Codemagic CI/CD configuration for Tawwab (تَوَّاب)
# iOS workflow: build + sign + upload to TestFlight (App Store Connect API)
# Android workflow: build release APK/AAB for Google Play

definitions:
  scripts: &ios_signing_setup
    name: Set up iOS code signing via App Store Connect API key
    script: |
      # App Store Connect API key (base64-encoded .p8 file) stored in Codemagic as IOS_ASC_KEY
      # Team ID and Key ID stored as IOS_ASC_KEY_ID and IOS_TEAM_ID
      echo $IOS_ASC_KEY | base64 --decode > /tmp/asc_key.p8
      mkdir -p ~/.private_keys
      cp /tmp/asc_key.p8 ~/.private_keys/AuthKey_$IOS_ASC_KEY_ID.p8
workflows:
  ios-release:
    name: Tawwab iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tawwab.app
      vars:
        IOS_ASC_KEY_ID: $IOS_ASC_KEY_ID
        IOS_TEAM_ID: $IOS_TEAM_ID
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *ios_signing_setup
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - abdulrahman@example.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit: false
        release_type: TESTFLIGHT
        # TestFlight: build uploaded to App Store Connect -> TestFlight tab

  android-release:
    name: Tawwab Android Release
    max_build_duration: 60
    instance_type: linux_x2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      android_signing:
        - keystore: keystore.jks
          alias: tawwab
      vars:
        FCI_KEYSTORE: $FCI_KEYSTORE
        FCI_KEYSTORE_PASSWORD: $FCI_KEYSTORE_PASSWORD
        FCI_KEY_PASSWORD: $FCI_KEY_PASSWORD
        FCI_KEY_ALIAS: $FCI_KEY_ALIAS
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android AAB (Play Store)
        script: |
          # decode keystore from environment variable (base64)
          echo $FCI_KEYSTORE | base64 --decode > android/app/keystore.jks
          # create key.properties
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$FCI_KEYSTORE_PASSWORD
          keyPassword=$FCI_KEY_PASSWORD
          keyAlias=$FCI_KEY_ALIAS
          EOF
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
